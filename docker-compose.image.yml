# 画像生成(MCP の image_generate)を**自分の GPU で回す**ための上書き。
# 本体(docker-compose.yml)と重ねて使う:
#
#   docker compose -f docker-compose.yml -f docker-compose.image.yml --profile image up -d
#
# NVIDIA の GPU が要る(NVIDIA Container Toolkit を入れておくこと)。
# **GPU が別のマシンにあるなら、このファイルは重ねない** —— そちらで ComfyUI を動かし、
# chiezo-api には CHIEZO_IMAGE_URL でその URL を渡せばよい(推論サーバと同じ逃げ道)。
#
# **モデル(チェックポイント)は自分で置く。** 数 GB あり、ライセンスも配布条件も
# モデルごとに違うので、こちらでは同梱も自動取得もしない。
# `./models/comfyui/checkpoints/` に .safetensors を置くと、相手に聞いて選べるようになる。
services:
  chiezo-image:
    # ComfyUI に公式のイメージは無い。**保守されているコミュニティのものをタグで固定する**
    # (:latest は 2026 年半ばに廃止された。cu126-slim = NVIDIA 向け)。
    image: ${CHIEZO_IMAGE_IMAGE:-yanwk/comfyui-boot:cu126-slim}
    profiles: ["image"]
    # ホストへは公開しない(chiezo-api からのみ到達する)。
    # 手元のブラウザで ComfyUI の画面を触りたいときだけ ports を足す
    environment:
      - CLI_ARGS=--listen 0.0.0.0 --port 8188
    volumes:
      # モデル・出力・カスタムノードの置き場(数 GB。data/ とは分ける)
      - ./models/comfyui:/root
    restart: unless-stopped
    # 生成は GPU を占有するので、CPU が競合したときは取り込みや配信へ譲る
    cpu_shares: 512
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # モデルの読み込みが終わるまで応答しないので、起動猶予を長めに取る
      test: ["CMD", "curl", "-fs", "http://localhost:8188/system_stats"]
      interval: 60s
      start_period: 300s
