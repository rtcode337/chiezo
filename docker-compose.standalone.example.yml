# `.env` を置けず、環境変数も設定できない実行環境向けの単体定義。
# (管理画面に YAML を貼り付けて起動するタイプの環境を想定)
#
# docker-compose.yml との違いは「${...} を使わず、値を YAML に直接書く」点だけ。
# ${...} は `.env` かシェルの環境変数からしか解決できず、どちらも無い環境では
# 既定値のあるものしか効かないため。profile も付けられない前提なので、
# 使うサービスだけをここに並べる(取り込みは管理画面の初期化ボタンから叩く)。
#
# 使い方:
#   1. cp docker-compose.standalone.example.yml docker-compose.standalone.yml
#      (コピー先は .gitignore 済み。**実値を書くのはコピーした側**で、
#       雛形のこのファイルには置き場の絶対パスも接続先の IP も書かない)
#   2. 「ここだけ編集」の置き場を、そのホストの絶対パスに書き換える
#   3. その内容を管理画面に貼り付けて起動する
#   4. http://<ホスト>:7010/ を開く(DB が無い間もソース 0 件で起動する)
#
# ソースプラグインは下のコメントを外すと使える(この環境ではオーバーレイを重ねられないので
# ここに直接書いてある)。
#
# **「答える」層は、chiezo-api に渡す設定だけを載せてコンテナは載せていない。** 推論サーバと
# 検索エンジンは別サーバーで動かしているものを指せば済み(chiezo-api は OpenAI 互換の口を
# 叩くだけ)、貼り付けて動かすような小さな実行環境で同居させる前提も無いため。同じホストに
# 立てるなら、上書きを重ねられる環境で docker-compose.answer.yml を使うこと。
#
# 通常の環境では docker-compose.yml を使う(こちらは値の直書きぶん古くなりやすい)。

# ---- ここだけ編集: データの置き場 ----
# 管理画面から登録する環境では相対パス (./data) の基準が分かりにくいので絶対パスで書く。
# data はダンプから作った .db の置き場、notes は「覚える」層の書き込み先。
# どちらも**あらかじめ作っておくこと**(取り込んだ .db は data に置く)。
x-data-dir: &data-dir "/path/to/chiezo/data"
x-notes-dir: &notes-dir "/path/to/chiezo/notes"
# 管理画面から入れた設定(話す相手の on/off・API キー)の置き場。**API キーが入る**
x-state-dir: &state-dir "/path/to/chiezo/state"
# Antigravity のサインイン結果の置き場(CLI ブリッジを使う場合だけ)。
# state の下に置く想定だが、**YAML は文字列を連結できない**ので別のアンカーにしてある
# —— 上の x-state-dir を変えたら、こちらも同じ場所を指すように直すこと。
x-bridge-home-dir: &bridge-home-dir "/path/to/chiezo/state/bridge-antigravity-home"

services:
  # 検索 API・MCP・管理画面。これが本体で、単体で起動する。
  chiezo-api:
    # 障害時は :latest ではなく :sha-xxxxxxx を指定すれば任意の時点に戻せる
    image: ghcr.io/rtcode337/chiezo-api:latest
    container_name: chiezo-api
    ports:
      # host:container。8000 は他のアプリと衝突しやすいので避けている
      - "7010:7010"
    volumes:
      # 配信側は読み取り専用。書くのは取り込み側(chiezo-trigger)だけ
      - type: bind
        source: *data-dir
        target: /data
        read_only: true
      # notes(短期記憶)だけは書き込む。/data の read-only は崩さず別ディレクトリにする
      # (同じ場所に置くと、1 件書くたびに全ソースの再走査が走る)
      - type: bind
        source: *notes-dir
        target: /notes
      # 管理画面から入れた設定。notes と分けるのは、あちらが「覚える」層の中身で、
      # 消してよいものと消してはいけないものが混ざるため
      - type: bind
        source: *state-dir
        target: /state
    environment:
      CHIEZO_DATA_DIR: /data
      # 「覚える」層(/v1/notes)。空にすると機能ごと無効になる
      CHIEZO_NOTES_DIR: /notes
      # 管理画面の初期化ボタンから叩く chiezo-trigger の内部 URL(ホストには公開しない)。
      # サービス名で引くので、下の chiezo-trigger の名前を変えるならここも合わせる
      CHIEZO_TRIGGER_URL: http://chiezo-trigger:8080
      # 管理画面から入れた設定(話す相手の on/off・API キー・モデル)の置き場。
      # 未設定だと管理画面から相手を増やせない(環境変数で指す相手だけが使える)。
      CHIEZO_STATE_DIR: /state
      # 本体の調整はどれも既定があるため、変えたいときだけ足す(素のままなら書かない)。
      #CHIEZO_MCP_ALLOWED_HOSTS: "chiezo.example.com:7010,localhost:*"  # /mcp の Host 検証
      #CHIEZO_RESCAN_INTERVAL: "5"    # data/ の変化を拾う間隔(秒)。低速なディスクでは伸ばす
      #CHIEZO_CATALOG_TTL: "300"      # ソース一覧(GET /sources)のキャッシュ(秒)
      #
      # ---- 「答える」層(/v1/ask・/v1/chat・/ai/chat)を使う場合 ----
      # **話す相手は管理画面(/admin)の「話す相手」から on/off する。**
      # 同居の推論サーバも Gemini も OpenRouter も CLI ブリッジも同じ扱いで、URL は
      # api/app/providers.py に決め打ち。入れるのは API キーと on/off とモデルだけで、
      # 保存先は上の CHIEZO_STATE_DIR。
      #
      # ここに書くのは、**推論サーバを別マシンで動かしている場合の URL だけ**。
      # 同居なら書かなくてよい(コンテナ名で辿り着けるので決め打ちが効く)。
      #CHIEZO_LLM_URL: http://192.0.2.10:7011/v1     # ← 別マシンの推論サーバ
      #
      # CLI ブリッジ(Claude Code / Codex CLI)を使うなら、この定義の下のほうにある
      # chiezo-bridge-* のコメントも外すこと。
      #
      # 会話の既定。GPU で 8B 級を動かしていて「Chiezo の知識を持った相手と普通に話す」
      # 使い方をしたいなら agent + 0 に倒す(素の既定は rag + 1)。
      #CHIEZO_ASK_DEFAULT_MODE: agent
      #CHIEZO_ASK_DEFAULT_GROUNDED: "0"
      #
      # ---- web 検索(agent モードの道具に加える。既定では無効)----
      # **この 1 行が機能フラグを兼ねる**。取り込んだダンプより新しい出来事や、いま現在の
      # 状態を聞かれたときだけモデルが使う(本文は取りに行かず、タイトル・要約・URL だけ)。
      # **検索エンジン(SearXNG)はこの定義にも入っている**(下の searxng)ので、
      # 同居のものを指すならサービス名でよい。別ホストのものを指すならその URL を書く。
      CHIEZO_WEB_SEARCH_URL: http://searxng:7012/search   # 同居のもの(使わないなら空に)
      #CHIEZO_WEB_SEARCH_URL: http://192.0.2.20:7012/search   # ← 別に立てた SearXNG
      #CHIEZO_WEB_SEARCH_PROVIDER: searxng   # searxng(既定)/ brave
      #CHIEZO_WEB_SEARCH_API_KEY: ""         # brave のときだけ
      #CHIEZO_WEB_SEARCH_RESULTS: "5"        # 1 回に見る件数
      #CHIEZO_WEB_SEARCH_TIMEOUT: "10"       # 秒
      #
      # ---- 画像生成(MCP の image_generate)----
      # 置き場は既定で CHIEZO_STATE_DIR の下(上でマウント済み)。**GPU は別マシンに
      # 置くのが普通**なので、そちらの ComfyUI を指す。指さなければ外部(Gemini)だけが使える
      # (鍵は管理画面の「話す相手」に登録したものを流用する)。
      #CHIEZO_IMAGE_URL: http://192.0.2.30:7014    # ← GPU マシンの ComfyUI(素の ComfyUI なら 8188)
      #CHIEZO_MEDIA_DIR: /state/media              # 置き場(既定は CHIEZO_STATE_DIR の下)
      #CHIEZO_MEDIA_KEEP_DAYS: "14"                # 出来た画像を残す日数
      #CHIEZO_IMAGE_TIMEOUT: "300"                 # 1 枚あたりの上限(秒)
      #
      # ---- 回答・agent の調整(どれも既定があるので、変えたいときだけ)----
      # agent に要るコンテキスト長の目安 = MAX_STEPS × TOOL_CHARS(+ 質問と道具の定義で 2〜3k)。
      # 相手を待つ時間(秒)。既定は相手で変わる: CLI ブリッジ経由 900 / それ以外 120。
      # **ブリッジ自身の上限(CHIEZO_BRIDGE_TIMEOUT)より長く**すること —— 待つ側が先に
      # 切れると、向こうが何秒で諦めたかも分からないまま ReadTimeout だけが残る。
      #CHIEZO_ANSWER_TIMEOUT: "900"
      #CHIEZO_ANSWER_DOCS: "4"          # 根拠として本文を取ってくる文書数
      #CHIEZO_ANSWER_MAX_CHARS: "6000"  # 抜粋の合計文字数
      #CHIEZO_AGENT_MAX_STEPS: "6"      # 道具を呼べる回数の上限
      #CHIEZO_AGENT_TOOL_CHARS: "3000"  # 1 回の道具の結果をモデルに返す上限文字数
      #CHIEZO_AGENT_TIMEOUT: "180"      # ループ全体の締め切り(秒)
    depends_on:
      - chiezo-trigger
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:7010/healthz"]
      interval: 60s

  # agent モードの道具 `web_search` が引く検索エンジン。**設定を焼き込んだイメージ**なので、
  # リポジトリが無くてもこれだけで立つ(素の searxng/searxng は settings.yml を要求する)。
  # ホストへは公開しない —— 使うのは chiezo-api だけで、外向きの検索の中継になるため。
  # 使わないなら、このブロックごと消して上の CHIEZO_WEB_SEARCH_URL も空にする。
  searxng:
    image: ghcr.io/rtcode337/chiezo-searxng:latest
    container_name: chiezo-searxng
    environment:
      # プリファレンスの Cookie と画像プロキシの署名に使う値(LAN 内前提の既定のまま)
      SEARXNG_SECRET: "chiezo-lan"
      # 待ち受けを 7012 にする(既定は 8080)。**この image は granian で動く**ので
      # 効くのは GRANIAN_PORT(SEARXNG_PORT は設定ファイル側の値)
      GRANIAN_PORT: "7012"
    restart: unless-stopped
    cpu_shares: 512
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7012/healthz"]
      interval: 60s

  # 管理画面からの「未初期化データの初期化」を受けて ingest を実行する内部専用トリガー。
  # ingest イメージを流用し、CMD だけ server:app(FastAPI)起動に上書きする。
  # ホストへポート公開せず、chiezo-api からのみ docker 内部ネットワーク経由で到達できる。
  chiezo-trigger:
    image: ghcr.io/rtcode337/chiezo-ingest:latest
    container_name: chiezo-trigger
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      # 取り込みは書き込むので read_only にしない
      - type: bind
        source: *data-dir
        target: /data
    environment:
      CHIEZO_DATA_DIR: /data
      # ---- 別コンテナのソースプラグインを使う場合 ----
      # 下の chiezo-plugin を有効にしたら、その URL をカンマ区切りで並べる。
      # プラグインが提供するソースが管理画面の「未初期化データの初期化」に出る。
      #CHIEZO_PLUGIN_SOURCES: http://chiezo-plugin:8080
    restart: unless-stopped
    # 「良き隣人」のための相対ウェイト(既定 1024 の半分)。CPU が競合したときだけ
    # 他のコンテナへ譲り、空いていれば全力で使える。ハード上限の cpus は使わない ——
    # CPU CFS スケジューラのバンド幅制御を無効にしたカーネルでは作成自体が失敗するため。
    # この項目を受け付けない実行環境なら、行ごと消してよい(無くても動く)
    cpu_shares: 512
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/healthz"]
      interval: 60s

  # ---- CLI の AI と話す場合だけ、以下のコメントを外す ----
  #
  # これらは HTTP ではなく CLI なので、OpenAI 互換の口に見せるブリッジを挟む。
  # **サブスクの枠で使うためのもの**で、API キー経路は従量課金になるため使わない。
  # **イメージは 1 つで、CHIEZO_BRIDGE_CLI で役割を決める**(1 回 pull すればディスクは
  # 1 つぶんで、コンテナを何個立てても増えるのは書き込み層だけ)。使うものだけ外せばよい。
  # 立ち上げたら管理画面(/admin)の「話す相手」で on にできるようになる
  # (到達できない間は押せない)。
  #
  #chiezo-bridge-claude:
  #  image: ghcr.io/rtcode337/chiezo-bridge:latest
  #  container_name: chiezo-bridge-claude
  #  volumes:
  #    # 認証情報は Chiezo の設定 DB から読む(管理画面から登録する)。読み取り専用
  #    - type: bind
  #      source: *state-dir
  #      target: /state
  #      read_only: true
  #  environment:
  #    CHIEZO_BRIDGE_CLI: claude
  #    CHIEZO_BRIDGE_MCP_URL: http://chiezo-api:7010/mcp
  #  restart: unless-stopped
  #  cpu_shares: 512
  #
  #chiezo-bridge-codex:
  #  image: ghcr.io/rtcode337/chiezo-bridge:latest
  #  container_name: chiezo-bridge-codex
  #chiezo-bridge-antigravity:
  #  image: ghcr.io/rtcode337/chiezo-bridge:latest
  #  container_name: chiezo-bridge-antigravity
  #  volumes:
  #    - type: bind
  #      source: *bridge-home-dir
  #      target: /srv/bridge/home
  #  environment:
  #    CHIEZO_BRIDGE_CLI: antigravity
  #    CHIEZO_BRIDGE_MCP_URL: http://chiezo-api:7010/mcp
  #  restart: unless-stopped
  #  cpu_shares: 512

  # ---- ソースプラグインを使う場合だけ、以下のコメントを外す ----
  #
  # プラグインは **Chiezo とは別のリポジトリ・別のイメージ**で、取得した文書を NDJSON で
  # 配るだけのサービス(DB を焼くのは chiezo-trigger 側)。**この環境ではオーバーレイを
  # 重ねられない**ので、プラグイン側の docker-compose.plugin.yml の代わりにここへ直接書く。
  #
  # 有効にするには (1) 下のブロックのコメントを外し、(2) chiezo-trigger の environment の
  # CHIEZO_PLUGIN_SOURCES を有効にする。増やすときはサービスを足し、URL を `,` で並べる。
  #
  # イメージが非公開なら、先にその環境で GHCR へログインしておくこと
  # (`docker login ghcr.io`。管理画面から貼り付ける環境では、その環境の
  # レジストリ認証の設定が要る)。
  #
  # 契約とプラグインの書き方は docs/adding-a-source.md のケース 3 が正。
  #
  #chiezo-plugin:
  #  image: ghcr.io/<自分のアカウント>/chiezo-plugin:latest
  #  container_name: chiezo-plugin
  #  # ホストへポート公開しない。chiezo-trigger からのみ到達できればよい
  #  restart: unless-stopped
  #  cpu_shares: 512
  #  healthcheck:
  #    test: ["CMD", "python", "-c",
  #           "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
  #    interval: 60s
