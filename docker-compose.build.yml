# 手元でイメージをビルドして動かす上書き(api/ ingest/ を変更したときの動作確認)。
# 本番は docker-compose.yml が GHCR から pull するので、こちらを重ねないと反映されない。
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# 違いはビルドするかどうかだけなので、ここには build と image しか書かない。
# 以前は本体をまるごと写していて、実際に web 検索と回答パイプラインの設定が抜けたまま
# 取り残されていた(上書きにすれば構造上ずれない)。
# タグを :local にしてあるのは、pull した本番イメージと取り違えないため。
# 「答える」層(推論・検索エンジン)は公開イメージをそのまま使うのでここには出てこない。
#
# api だけコンテキストがリポジトリのルート。やること画面(tasks-frontend/)を同じ
# イメージへ焼くので、api/ の中だけでは足りない(CI も同じ組み合わせでビルドしている)。
# 手元では data/ が数十 GB あるが、ルートの .dockerignore が除くので daemon へは送られない。
services:
  chiezo-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ghcr.io/rtcode337/chiezo-api:local

  chiezo-trigger:
    build: ./ingest
    image: ghcr.io/rtcode337/chiezo-ingest:local

  chiezo-ingest:
    build: ./ingest
    image: ghcr.io/rtcode337/chiezo-ingest:local
