# 絵と音の生成(MCP の image_generate / audio_generate)を自分の GPU で回すための上書き。
# 本体(docker-compose.yml)と重ねて使う:
#
#   docker compose -f docker-compose.yml -f docker-compose.comfyui.yml --profile comfyui up -d
#
# NVIDIA の GPU が要る(NVIDIA Container Toolkit を入れておくこと)。
# GPU が別のマシンにあるなら、このファイルは重ねない —— そちらで ComfyUI を動かし、
# chiezo-app には CHIEZO_IMAGE_URL でその URL を渡せばよい(推論サーバと同じ逃げ道)。
#
# モデル(チェックポイント)は自分で置く。 数 GB あり、ライセンスも配布条件も
# モデルごとに違うので、こちらでは同梱も自動取得もしない。
# `./models/comfyui/ComfyUI/models/checkpoints/` に .safetensors を置くと、相手に聞いて
# 選べるようになる(この上書きは ./models/comfyui をコンテナの /root に繋ぐので、
# ComfyUI 本体が展開される 1 段下がモデルの置き場になる)。
#
# 絵と音で別のファイルが要る(置き場は同じ checkpoints):
#   絵     … 好きな SDXL 系など
#   効果音 … stable-audio-open-1.0.safetensors
#            + ./models/comfyui/ComfyUI/models/text_encoders/t5-base.safetensors
#   曲     … ace_step_v1_3.5b.safetensors(all-in-one)
# 名前で系統を見分ける(名前に audio か ace を含むものを音として扱う)ので、
# 名前は変えずに置くこと。変えたときは model で名指しする。
services:
  chiezo-image:
    # ComfyUI に公式のイメージは無い。保守されているコミュニティのものを**日付つきの
    # タグで固定する**(:latest は 2026 年半ばに廃止された。cu126-slim = NVIDIA 向け)。
    # `cu126-slim` は毎週差し替わる動くタグなので、それを書くと pull した日で中身が変わる。
    # 上流は同じものに `cu126-slim-<日付>` も付けて残しているので、そちらを書く
    # (Dependabot の docker-compose の更新もこの行を追う)。
    #
    # root のまま動かす。 このイメージは /root をホームと置き場の前提に組んであり
    # (起動スクリプトが /root/ComfyUI へ展開し、pip も /root/.local へ入れる)、
    # 非 root に切り替える口を持たない。代わりにホストへポートを出さず
    # (chiezo-app からだけ届く)、ComfyUI-Manager の安全度を下の command で固定する。
    image: ${CHIEZO_IMAGE_IMAGE:-yanwk/comfyui-boot:cu126-slim-20260810}
    # **ComfyUI-Manager の security_level を起動のたびに normal へ戻す。**
    # weak にすると、画面や API から任意の拡張(=任意のコード)を入れられる。
    # 設定は置き場(./models/comfyui/ComfyUI/user/__manager/config.ini)にあって
    # リポジトリの外なので、手で緩めたままになっていても気づけない。イメージに
    # 設定の環境変数が無いので、起動スクリプトの手前で書き戻してから渡す。
    command:
      - bash
      - -c
      - >-
        f=/root/ComfyUI/user/__manager/config.ini;
        if [ -f "$$f" ]; then sed -i 's/^security_level *=.*/security_level = normal/' "$$f"; fi;
        exec bash /runner-scripts/entrypoint.sh
    profiles: ["comfyui"]
    # ホストへは公開しない(chiezo-app からのみ到達する)。
    # 手元のブラウザで ComfyUI の画面を触りたいときだけ ports を足す
    environment:
      # 待ち受けを 7014 にする(既定は 8188)。7010 = API・7011 = 推論・7012 = 検索・
      # 7013 = CLI ブリッジ の並びに合わせ、コンテナの内と外で番号を食い違わせない
      - CLI_ARGS=--listen 0.0.0.0 --port 7014
    volumes:
      # モデル・出力・カスタムノードの置き場(数 GB。data/ とは分ける)
      - ./models/comfyui:/root
    restart: unless-stopped
    # 生成は GPU を占有するので、CPU が競合したときは取り込みや配信へ譲る
    cpu_shares: 512
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # モデルの読み込みが終わるまで応答しないので、起動猶予を長めに取る
      test: ["CMD", "curl", "-fs", "http://localhost:7014/system_stats"]
      interval: 60s
      start_period: 300s
