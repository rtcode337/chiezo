# 依存の更新 PR を週 1 でまとめて受け取る(月曜 JST)。
# 直接の依存は `requirements.in` で範囲指定(>=)しており、実際に入る版はそれを
# コンパイルした `requirements.txt`(ハッシュ付き)で固定してある。ここで拾いたいのは
# 「範囲の外に出る新メジャー」(実例: mcp 2.0)と、上限ピンを入れた依存の解除時期、
# Actions・ベースイメージの更新。CI(ruff + pytest)が通るかは PR ごとに自動で検証される。
#
# ロックの更新は Dependabot に任せない(uv がコンパイルした形式は Dependabot が
# 書き戻せない)。範囲を動かす PR が来たら、手元で
# `scripts/lock_requirements.sh` を回して requirements.txt を作り直す。
version: 2
updates:
  # Python 依存(app = 配信、ingest = 取り込み、ルート = 開発・CI 用)
  - package-ecosystem: pip
    directories:
      - /app
      - /ingest
      - /
    schedule:
      interval: weekly
      timezone: Asia/Tokyo

  # CLI ブリッジの Python 依存(bridge/requirements.txt。こちらは版を == で直に固定している)
  - package-ecosystem: pip
    directory: /bridge
    schedule:
      interval: weekly
      timezone: Asia/Tokyo

  # Dockerfile のベースイメージ(python:3.12-slim、ブリッジの node / debian)。
  # ブリッジの CLI(npm install の @版 と agy の下限)は追えないので、人が上げる
  - package-ecosystem: docker
    directories:
      - /app
      - /ingest
      - /bridge
    schedule:
      interval: weekly
      timezone: Asia/Tokyo

  # compose が pull するイメージ(searxng・llama.cpp・alpine・ComfyUI)。
  # どれもタグを固定してあるので、上げるきっかけはここから来る。
  # 自前の chiezo-* は :latest なので対象にならない(CI が焼いて公開する)。
  # `${変数:-既定}` で書いた行を読めるかは Dependabot の版次第 —— 来なければ人が上げる
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Tokyo

  # GitHub Actions(actions/checkout 等。Node ランタイムの非推奨化への追従もこれで拾う)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
