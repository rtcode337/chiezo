# GPU の要るものを LAN の別ホストから使うための公開。開けるのは推論サーバと画像生成で、
# **どちらも GPU のあるマシンに置く必然性がある**もの。
# docker-compose.llm.yml に重ねる(GPU を使うなら cuda の後ろ):
#
#   docker compose -f docker-compose.yml -f docker-compose.llm.yml \
#                  -f docker-compose.llm.cuda.yml -f docker-compose.lan.yml \
#                  --profile llm up -d chiezo-llm
#
# 検索エンジン(SearXNG)はここに無い。本体の compose に入っていて、chiezo-app を
# 立てるマシンには必ず一緒に立てられるので、別ホストのものを指す理由が無いため
# (検索の中継なので軽い)。
#
# 相手側の chiezo-app には .env でこう渡す(このホストの IP に読み替える):
#
#   CHIEZO_LLM_URL=http://<このホストのIP>:7011/v1
#   CHIEZO_IMAGE_URL=http://<このホストのIP>:7014
#
# 同じホストに chiezo-app がいるなら重ねない。 その場合はサービス名で届くので
# (http://chiezo-llm:7011/v1・http://chiezo-image:7014)、口を開ける理由が無い。
#
# 開ける以上は前提を承知しておくこと —— どちらも認証が無い。誰でも VRAM を使える
# ようになり(空きが尽きるとホストごとページングで固まる)、ComfyUI は画面も
# 付いてくるので LAN の誰でもワークフローを流せる。ルーターでポート開放しないこと。
# 推論に鍵を掛けるなら llama-server の --api-key と相手側の CHIEZO_LLM_API_KEY を揃える。
services:
  chiezo-llm:
    ports:
      - "7011:7011"

  # 画像生成(ComfyUI)。GPU のあるマシンで立てて、別ホストの chiezo-app から使う
  # ときに開ける。相手側には CHIEZO_IMAGE_URL=http://<このホストのIP>:7014 を渡す。
  # 定義は docker-compose.comfyui.yml 側なので、そちらも重ねて --profile comfyui を付ける。
  chiezo-image:
    ports:
      - "7014:7014"
