# 本番用。イメージは GitHub Actions(.github/workflows/ci.yml)が main への push で
# ビルドし GHCR へ公開する(amd64 / arm64)。本番ではビルドせず pull するだけ:
#
#   docker compose pull && docker compose up -d
#
# 障害時は :latest ではなく :sha-xxxxxxx を指定すれば任意の時点に戻せる
# (CHIEZO_API_IMAGE / CHIEZO_INGEST_IMAGE で上書き可)。
#
# **このファイルは検索 API・MCP としての Chiezo だけ**(chiezo-api + chiezo-trigger +
# chiezo-ingest)。足すものは上書きファイルを重ねる。どれも数行〜数十行で、
# 重ねる順は下の並びどおり(後のファイルが勝つ):
#
#   docker-compose.build.yml    手元でビルドして :local タグで動かす(本番は pull)
#   docker-compose.answer.yml   「答える」層(推論サーバ + 検索エンジン)
#   docker-compose.cuda.yml     推論を NVIDIA の GPU で動かす(answer に重ねる)
#   docker-compose.lan.yml      「答える」層を LAN の別ホストの chiezo-api へ公開する
#
# 使い分けは docs/operations.md、「答える」層は docs/ai.md が正。

# 取り込み系コンテナ共通のリソース制限(YAML アンカー)。cpu_shares は「良き隣人」のための
# 相対ウェイト(既定 1024 の半分)。CPU が競合したときだけ他のコンテナへ譲り、空いていれば
# 全力で使える。ハード上限の cpus は使わない — CPU CFS スケジューラのバンド幅制御を
# 無効にしたカーネルではコンテナ作成自体が失敗するため。
# メモリの上限(mem_limit)はあえて課さない。取り込みは潤沢メモリのマシンで回す前提で、
# 逆に上限で締めると OOM killer が構築を殺してしまう(以前 1GiB で締めたら osm のノード座標
# インデックスが入りきらず落ちた)。「メモリが足りる環境でだけ実行する」判断は、コンテナ上限では
# なく ingest 側のプリフライト検査(main.py の require_build_memory / adapter.min_build_memory_gb)で
# 行う。足りなければ構築を始める前に明示的に SystemExit する。8GB 級の共有ホストでは重い取り込みは
# そもそも実行拒否され、成果物の .db は別マシンで焼いて配布する(docs/operations.md「別マシンでビルドして .db を配布する」参照)。
x-ingest-limits: &ingest-limits
  cpu_shares: 512

services:
  chiezo-api:
    image: ${CHIEZO_API_IMAGE:-ghcr.io/rtcode337/chiezo-api:latest}
    ports:
      # host:container。8000 は他のアプリと衝突しやすいので避けている。
      - "7010:7010"
    volumes:
      - ./data:/data:ro
      # notes(短期記憶)だけは書き込む。/data の read-only は崩さず別ディレクトリにする
      # (同じ場所に置くと、1 件書くたびに全ソースの再走査が走る。api/app/notes.py 参照)。
      - ./notes:/notes
      # 管理画面から入れた設定(話す相手の on/off・API キー・モデル)。notes と分けるのは、
      # あちらが「覚える」層の中身で、消してよいものと消してはいけないものが混ざるため。
      - ./state:/state
    environment:
      - CHIEZO_DATA_DIR=/data
      # 「覚える」層(/v1/notes)。空にすると機能ごと無効になる。
      - CHIEZO_NOTES_DIR=/notes
      # 管理画面の初期化ボタンから叩く chiezo-trigger の内部 URL(ホストには公開しない)。
      - CHIEZO_TRIGGER_URL=http://chiezo-trigger:8080
      # 本体の調整(どれも既定のままなら書かなくてよい。空文字なら既定に倒れる)。
      # /data の再走査間隔(秒)・ソースカタログのキャッシュ(秒)・/mcp の Host 検証。
      - CHIEZO_RESCAN_INTERVAL=${CHIEZO_RESCAN_INTERVAL-}
      - CHIEZO_CATALOG_TTL=${CHIEZO_CATALOG_TTL-}
      - CHIEZO_MCP_ALLOWED_HOSTS=${CHIEZO_MCP_ALLOWED_HOSTS-}
      # 「答える」層(/v1/ask・/ai/chat)。**話す相手は管理画面(/admin)から on/off する** ——
      # 同居の推論サーバも Gemini も OpenRouter も CLI ブリッジも同じ扱いで、URL は
      # api/app/providers.py に決め打ち。ユーザーが入れるのは API キーと on/off と
      # モデルだけで、保存先が下の /state。
      # **推論サーバ・検索エンジンのコンテナは docker-compose.answer.yml にある**。
      - CHIEZO_STATE_DIR=/state
      # 推論サーバを**別マシンで**動かしている場合だけ、その URL を書く。
      # 同居(chiezo-llm)なら書かなくてよい —— コンテナ名で辿り着けるので決め打ちが効く。
      # これは「相手を増やす設定」ではなく、辿り着けない相手のための逃げ道。
      - CHIEZO_LLM_URL=${CHIEZO_LLM_URL-}
      - CHIEZO_ANSWER_TIMEOUT=${CHIEZO_ANSWER_TIMEOUT-}
      - CHIEZO_ANSWER_DOCS=${CHIEZO_ANSWER_DOCS-}
      - CHIEZO_ANSWER_MAX_CHARS=${CHIEZO_ANSWER_MAX_CHARS-}
      # agent モード(mode=agent)の上限。既定のままなら書かなくてよい。
      - CHIEZO_AGENT_MAX_STEPS=${CHIEZO_AGENT_MAX_STEPS-}
      - CHIEZO_AGENT_TOOL_CHARS=${CHIEZO_AGENT_TOOL_CHARS-}
      - CHIEZO_AGENT_TIMEOUT=${CHIEZO_AGENT_TIMEOUT-}
      # 会話画面・API の既定(素の既定は rag + grounded=1。潤沢な環境なら agent + 0 に倒せる)。
      - CHIEZO_ASK_DEFAULT_MODE=${CHIEZO_ASK_DEFAULT_MODE-}
      - CHIEZO_ASK_DEFAULT_GROUNDED=${CHIEZO_ASK_DEFAULT_GROUNDED-}
      # web 検索(既定では無効。URL を設定したときだけ agent の道具に加わる)。
      - CHIEZO_WEB_SEARCH_URL=${CHIEZO_WEB_SEARCH_URL-}
      - CHIEZO_WEB_SEARCH_PROVIDER=${CHIEZO_WEB_SEARCH_PROVIDER-}
      - CHIEZO_WEB_SEARCH_API_KEY=${CHIEZO_WEB_SEARCH_API_KEY-}
      - CHIEZO_WEB_SEARCH_RESULTS=${CHIEZO_WEB_SEARCH_RESULTS-}
      - CHIEZO_WEB_SEARCH_TIMEOUT=${CHIEZO_WEB_SEARCH_TIMEOUT-}
    depends_on:
      - chiezo-trigger
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:7010/healthz"]
      interval: 60s

  # 管理画面からの「未初期化データの初期化」を受けて ingest を実行する内部専用トリガー。
  # ingest イメージを流用し、CMD だけ server:app(FastAPI)起動に上書きする。
  # ホストへポート公開せず、chiezo-api からのみ docker 内部ネットワーク経由で到達できる。
  chiezo-trigger:
    image: ${CHIEZO_INGEST_IMAGE:-ghcr.io/rtcode337/chiezo-ingest:latest}
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - ./data:/data
    environment:
      - CHIEZO_DATA_DIR=/data
    restart: unless-stopped
    # トリガー経由の取り込みが暴走しても、OOM killer がホスト全体(同居する
    # 他のコンテナ)を巻き込まないよう上限を設ける。取り込み本体と同じ *_LIMITS。
    <<: *ingest-limits
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/healthz"]
      interval: 60s

  chiezo-ingest:
    image: ${CHIEZO_INGEST_IMAGE:-ghcr.io/rtcode337/chiezo-ingest:latest}
    profiles: ["ingest"]
    volumes:
      - ./data:/data
    environment:
      - SOURCE=jawiki
      - CHIEZO_DATA_DIR=/data
    # 取り込みのメモリ上限。以前 jawiki 取り込みが対応表(リダイレクト/ページビュー/
    # wikidata)を dict で数 GB 抱えてホストごと OOM で落ちたため、(1) それらを
    # ディスク上の一時 SQLite に逃がした上で(ingest/lookup.py)、(2) 念のため
    # コンテナ自体にも上限を課して、万一の暴走をコンテナ内で止める(道連れ防止)。
    <<: *ingest-limits

  # ---- CLI の AI と話す場合だけ、以下のコメントを外す ----
  #
  # これらは HTTP ではなく CLI なので、OpenAI 互換の口に見せるブリッジを挟む
  # (bridge/。**イメージは 1 つで、CHIEZO_BRIDGE_CLI で役割を決める**)。
  # イメージは 1 回 pull すればディスクは 1 つぶんで、コンテナを何個立てても増えるのは
  # 書き込み層(数 KB)だけ —— なので CLI ごとに分けず 1 枚にまとめてある。
  # **サブスクの枠で使うためのもの**で、API キー経路は従量課金になるため使わない。
  #
  # ブリッジは Chiezo の MCP(/mcp)を CLI に繋ぐので、**道具は CLI 自身が引く**。
  # CLI の組み込みの道具(シェル・ファイルの読み書き)は全部切ってある。
  #
  # 有効にするには (1) 下のブロックのコメントを外し、(2) `docker compose up -d` する。
  # **profile も追加の -f も要らない**。認証情報は .env ではなく**管理画面から登録する**
  # (ブリッジは Chiezo の設定 DB を読み取り専用でマウントして読む)。
  # 立ち上げるまでは管理画面の on が押せない(到達確認に落ちるため)。
  #
  # ホストへポートは公開しない(chiezo-api からのみ到達すればよい)。
  #
  #chiezo-bridge-claude:
  #  image: ghcr.io/rtcode337/chiezo-bridge:latest
  #  volumes:
  #    # 認証情報は Chiezo の設定 DB から読む(管理画面から登録できるようにするため)。
  #    # **読み取り専用**。ブリッジは書かない
  #    - ./state:/state:ro
  #  environment:
  #    - CHIEZO_BRIDGE_CLI=claude
  #    - CHIEZO_BRIDGE_MCP_URL=http://chiezo-api:7010/mcp
  #    - CHIEZO_BRIDGE_TIMEOUT=${CHIEZO_BRIDGE_TIMEOUT:-300}
  #  restart: unless-stopped
  #  # CLI は待ち時間の長い相手なので、CPU が競合したら取り込みや推論へ譲る
  #  cpu_shares: 512
  #  healthcheck:
  #    test: ["CMD", "curl", "-fs", "http://localhost:7013/health"]
  #    interval: 60s
  #
  #chiezo-bridge-codex:
  #  image: ghcr.io/rtcode337/chiezo-bridge:latest
  #  volumes:
  #    - ./state:/state:ro
  #  environment:
  #    - CHIEZO_BRIDGE_CLI=codex
  #    - CHIEZO_BRIDGE_MCP_URL=http://chiezo-api:7010/mcp
  #    - CHIEZO_BRIDGE_TIMEOUT=${CHIEZO_BRIDGE_TIMEOUT:-300}
  #  restart: unless-stopped
  #  cpu_shares: 512
  #  healthcheck:
  #    test: ["CMD", "curl", "-fs", "http://localhost:7013/health"]
  #    interval: 60s
